name: مەشخەڵ Android Build

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: 'Release tag containing the Meshkhal source ZIP asset'
        required: true
        default: 'v1.0.0-source'

permissions:
  contents: read

jobs:
  build:
    name: Validate, test, and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Android project source
        id: source
        shell: bash
        env:
          SOURCE_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.source_release_tag || 'v1.0.0-source' }}
        run: |
          set -euo pipefail
          if [[ -f "$GITHUB_WORKSPACE/settings.gradle.kts" && -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]]; then
            project_root="$GITHUB_WORKSPACE"
            echo "Found Android source in repository root."
          else
            if [[ -z "${SOURCE_RELEASE_TAG:-}" ]]; then
              echo "No source ZIP tag was provided." >&2
              exit 1
            fi
            download_dir="$RUNNER_TEMP/meshkhal-source-download"
            extract_dir="$RUNNER_TEMP/meshkhal-source-extracted"
            mkdir -p "$download_dir" "$extract_dir"
            gh release download "$SOURCE_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern '*source*.zip' \
              --dir "$download_dir"
            mapfile -t archives < <(find "$download_dir" -maxdepth 1 -type f -name '*.zip' -print)
            if [[ "${#archives[@]}" -ne 1 ]]; then
              echo "Expected exactly one source ZIP matching '*source*.zip' in release '$SOURCE_RELEASE_TAG'; found ${#archives[@]}." >&2
              find "$download_dir" -maxdepth 1 -type f -printf '%f\n' >&2 || true
              exit 1
            fi
            unzip -q "${archives[0]}" -d "$extract_dir"
            settings_file="$(find "$extract_dir" -type f -name 'settings.gradle.kts' -print -quit)"
            if [[ -z "$settings_file" ]]; then
              echo "The source ZIP does not contain settings.gradle.kts." >&2
              exit 1
            fi
            project_root="$(dirname "$settings_file")"
            if [[ ! -f "$project_root/app/build.gradle.kts" ]]; then
              echo "Found Gradle settings, but app/build.gradle.kts is missing." >&2
              exit 1
            fi
            echo "Using source ZIP from GitHub Release '$SOURCE_RELEASE_TAG'."
          fi
          echo "project_dir=$project_root" >> "$GITHUB_OUTPUT"
          echo "Project root: $project_root"

      - name: Apply repository validator
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/tools"
          if [[ "$GITHUB_WORKSPACE/tools/validate_project.py" != "$PROJECT_DIR/tools/validate_project.py" ]]; then
            cp "$GITHUB_WORKSPACE/tools/validate_project.py" "$PROJECT_DIR/tools/validate_project.py"
          fi

      - name: Align Java and Kotlin JVM targets
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              marker = "android {"
              if marker not in text:
                  raise SystemExit("Could not find the android { block in app/build.gradle.kts")
              insert = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              pos = text.index(marker) + len(marker)
              text = text[:pos] + insert + text[pos:]
              path.write_text(text, encoding="utf-8")
          print("Java and Kotlin compiler targets aligned to JVM 17.")
          PY

      - name: Remove stale bundled dexopt profiles
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          rm -f "$PROJECT_DIR/app/src/main/assets/dexopt/baseline.prof" "$PROJECT_DIR/app/src/main/assets/dexopt/baseline.profm"
          rmdir "$PROJECT_DIR/app/src/main/assets/dexopt" 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate source and bundled content
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: python3 tools/validate_project.py

      - name: Validate Gradle configuration
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: gradle --version && gradle :app:tasks --all --no-daemon

      - name: Run unit tests
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Build installable debug APK and release outputs
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Upload APKs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshkhal-android-build-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/release/*.apk
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/bundle/release/*.aab
            ${{ steps.source.outputs.project_dir }}/app/build/reports/**
            ${{ steps.source.outputs.project_dir }}/app/build/test-results/**
